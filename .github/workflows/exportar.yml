name: Exportar MP4
run-name: Exportar ${{ inputs.projeto }}

# Disparado pelo botão "Exportar" do app. Renderiza projetos/<id>/projeto.json em MP4 1080x1920
# e publica na release "exportes" (o app lista e baixa de lá).
on:
  workflow_dispatch:
    inputs:
      projeto:
        description: "id do projeto (pasta em projetos/)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: exportar-${{ inputs.projeto }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ID: ${{ inputs.projeto }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar id
        run: |
          if ! [[ "$ID" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || [ ! -f "projetos/$ID/projeto.json" ]; then
            echo "::error::Projeto '$ID' não encontrado em projetos/"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          npm ci
          pip install edge-tts==7.3.1
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null

      - name: Checar tipos
        run: npx tsc --noEmit

      - name: Renderizar
        run: |
          npx remotion browser ensure
          node scripts/renderizar.mjs "$ID" "out/video.mp4"

      - name: Publicar na release "exportes"
        run: |
          gh release view exportes > /dev/null 2>&1 || gh release create exportes --prerelease --title "Vídeos exportados" --notes "MP4 gerados pelo Estúdio Reels."
          NOME="$ID--$(date -u +%Y%m%d-%H%M%S).mp4"
          mv out/video.mp4 "out/$NOME"
          gh release upload exportes "out/$NOME"
          echo "### ✅ [$NOME]($(gh release view exportes --json url -q .url))" >> "$GITHUB_STEP_SUMMARY"
