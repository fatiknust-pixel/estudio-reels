name: Gerar vídeo com IA
run-name: Gerar ${{ inputs.projeto }}

# Modo 1. Disparado pelo app depois de você escrever tema, tom, cores e duração.
# 1) O Claude (sua assinatura, segredo CLAUDE_CODE_OAUTH_TOKEN) pesquisa fontes confiáveis e escreve
#    projetos/<id>/roteiro.json + imagens.json no formato do Astra (docs/guia-roteiro.md).
# 2) Narração com edge-tts (pt-BR-AntonioNeural +5%) e tempo por palavra.
# 3) Fotos reais (Wikipédia/Commons, Pixabay, Openverse, NASA) com autor e licença: o Claude olha as candidatas e escolhe.
on:
  workflow_dispatch:
    inputs:
      projeto:
        description: "id do projeto (pasta em projetos/)"
        required: true
        type: string
      ignorar_bloqueio:
        description: "Gerar mesmo com falhas seguidas (use depois de corrigir o problema)"
        required: false
        default: "false"
        type: string

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: ia-${{ inputs.projeto }}
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ID: ${{ inputs.projeto }}
    steps:
      - uses: actions/checkout@v4

      - name: Validar id
        env:
          TEM_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if ! [[ "$ID" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || [ ! -f "projetos/$ID/projeto.json" ]; then
            echo "::error::Projeto '$ID' não encontrado em projetos/"; exit 1
          fi
          if [ "$TEM_TOKEN" != "true" ]; then
            echo "::error::Falta o segredo CLAUDE_CODE_OAUTH_TOKEN (rode 'claude setup-token' e salve em Settings → Secrets → Actions)"; exit 1
          fi
          rm -f "projetos/$ID/roteiro.json" "projetos/$ID/imagens.json"

      - name: Disjuntor (pausa se a última geração falhou mesmo com 2 tentativas)
        if: inputs.ignorar_bloqueio != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cada geração já tenta 2 vezes. Se a última (ignorando as canceladas/pausadas) falhou há menos de 5 h,
          # o problema se repete (ex.: limite da assinatura): pausa aqui, antes de gastar com o Claude.
          ultima=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gerar-ia.yml/runs?status=completed&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion != "cancelled")][0] | {c: .conclusion, t: .updated_at, u: .html_url}')
          if [ "$(jq -r '.c' <<< "$ultima")" = "failure" ]; then
            idade=$(( $(date +%s) - $(date -d "$(jq -r '.t' <<< "$ultima")" +%s) ))
            if [ "$idade" -lt 18000 ]; then
              msg="Pausado: a última geração falhou mesmo com 2 tentativas (há $((idade / 60)) min). Provável limite da assinatura ou erro que se repete. Veja $(jq -r '.u' <<< "$ultima") e tente de novo mais tarde."
              echo "::error::$msg"
              # nunca marca como erro um vídeo que já ficou pronto
              [ "$(jq -r '.status' "projetos/$ID/projeto.json")" != "pronto" ] && scripts/salvar_no_repo.sh "Pausado $ID" python3 scripts/aplicar_resultado.py "projetos/$ID/projeto.json" --erro "$msg"
              gh run cancel "$GITHUB_RUN_ID"; sleep 60; exit 1
            fi
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar voz e ffmpeg
        run: |
          pip install edge-tts==7.3.1 opencv-python-headless==4.10.0.84
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Claude pesquisa e escreve o roteiro
        id: claude1
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "*" # a geração disparada por outra Action (fila do canal) roda como github-actions[bot]
          prompt: |
            Você é roteirista e pesquisador de vídeos curtos 9:16 (Reels/TikTok) em português do Brasil.

            1. Leia `docs/guia-roteiro.md` e siga-o à risca (inclusive "Estilo de edição" e "Regra de variedade"). Use `app/demos/demo-ia.json` (campo `cenas`) como exemplo de qualidade.
            2. Leia o pedido em `projetos/${{ inputs.projeto }}/projeto.json` (campo `pedido`: `tema`, `tom`, `duracao` em segundos;
               `genero` quando houver — siga as instruções do gênero; e o campo `formato` do projeto: 9:16 ou 16:9).
               O idioma do vídeo é `pedido.idioma` ou `idioma` do projeto (padrão pt-BR): escreva narração, textos na tela, `publicacao` e os
               títulos da Wikipédia (`wiki`) nesse idioma, direto, sem traduzir frase por frase. Se houver `genero` (canal dark),
               leia também `docs/guia-canal-dark.md` e siga a estrutura de capítulos, o ritmo, as fotos (`galeria` + `galeriaEm`) e o campo `publicacao`.
               Se houver `pedido.canal` (canal com um vídeo por dia): o vídeo é de um canal sobre `canal.nicho`; mantenha a voz e a identidade do canal,
               mas abra e estruture de forma diferente dos vídeos em `canal.anteriores` (não repita ganchos nem molde), e sempre com ângulo próprio e fontes.
            3. Pesquise o tema na web em fontes confiáveis e confira os fatos (datas, números, nomes).
            3b. Rode `node scripts/estilo-ia.mjs recentes ${{ inputs.projeto }}` para ver o estilo dos vídeos anteriores
               e escolha o `estilo` deste vídeo: o que vier fixo em `pedido.estilo` é obrigatório; onde estiver "auto",
               escolha combinando com o tema SEM repetir a dinâmica, a legenda, a transição e o fundo do vídeo anterior.
               Adapte o roteiro (ritmo, tamanho das frases, quantidade de elementos) à dinâmica e ao formato.
            4. Escreva `projetos/${{ inputs.projeto }}/roteiro.json` e `projetos/${{ inputs.projeto }}/imagens.json`:
               gancho forte no início, cenas curtas com elementos animados e fontes na tela, e no final
               uma pergunta para o público (enquete) e um CTA (seguir). Respeite o tom e a duração pedidos.
            5. Rode `node scripts/validar-roteiro.mjs projetos/${{ inputs.projeto }}` e corrija até aparecer "✅ Roteiro válido"
               (trate também os avisos de duração e de fontes).

            Só termine depois de gravar os dois arquivos com a ferramenta Write; se algo do pedido parecer estranho ou repetido,
            escolha a interpretação mais provável e escreva mesmo assim (ninguém vai responder perguntas).
            Não altere nenhum outro arquivo e não faça commit.
          claude_args: |
            --model sonnet
            --max-turns 140
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(node scripts/validar-roteiro.mjs:*),Bash(node scripts/estilo-ia.mjs:*)"

      - name: O Claude escreveu o roteiro?
        id: conferir1
        if: always()
        run: |
          # o Claude às vezes encerra "com sucesso" sem escrever os arquivos: mostra a resposta final e o que foi negado
          saida=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$saida" ]; then
            jq -r '[.[] | select(.type == "result")][-1] | "Resposta final do Claude:\n\(.result // "(vazia)")\n\nNegado: \([.permission_denials[]? | .tool_name + " " + ((.tool_input.command // .tool_input.file_path // .tool_input.url // "") | tostring)] | join(" | "))"' "$saida" || true
          fi
          if [ -f "projetos/$ID/roteiro.json" ] && [ -f "projetos/$ID/imagens.json" ]; then echo "faltou=false" >> "$GITHUB_OUTPUT"
          else echo "::warning::O Claude terminou sem escrever roteiro.json/imagens.json"; echo "faltou=true" >> "$GITHUB_OUTPUT"; fi

      - name: Esperar antes da 2ª tentativa
        if: steps.claude1.outcome == 'failure' || steps.conferir1.outputs.faltou == 'true'
        run: |
          echo "::warning::1ª tentativa do Claude falhou — tentando mais uma vez"
          rm -f "projetos/$ID/roteiro.json" "projetos/$ID/imagens.json"
          sleep 30

      - name: Claude pesquisa e escreve o roteiro (2ª tentativa)
        id: claude2
        if: steps.claude1.outcome == 'failure' || steps.conferir1.outputs.faltou == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "*" # a geração disparada por outra Action (fila do canal) roda como github-actions[bot]
          prompt: |
            Você é roteirista e pesquisador de vídeos curtos 9:16 (Reels/TikTok) em português do Brasil.

            1. Leia `docs/guia-roteiro.md` e siga-o à risca (inclusive "Estilo de edição" e "Regra de variedade"). Use `app/demos/demo-ia.json` (campo `cenas`) como exemplo de qualidade.
            2. Leia o pedido em `projetos/${{ inputs.projeto }}/projeto.json` (campo `pedido`: `tema`, `tom`, `duracao` em segundos;
               `genero` quando houver — siga as instruções do gênero; e o campo `formato` do projeto: 9:16 ou 16:9).
               O idioma do vídeo é `pedido.idioma` ou `idioma` do projeto (padrão pt-BR): escreva narração, textos na tela, `publicacao` e os
               títulos da Wikipédia (`wiki`) nesse idioma, direto, sem traduzir frase por frase. Se houver `genero` (canal dark),
               leia também `docs/guia-canal-dark.md` e siga a estrutura de capítulos, o ritmo, as fotos (`galeria` + `galeriaEm`) e o campo `publicacao`.
               Se houver `pedido.canal` (canal com um vídeo por dia): o vídeo é de um canal sobre `canal.nicho`; mantenha a voz e a identidade do canal,
               mas abra e estruture de forma diferente dos vídeos em `canal.anteriores` (não repita ganchos nem molde), e sempre com ângulo próprio e fontes.
            3. Pesquise o tema na web em fontes confiáveis e confira os fatos (datas, números, nomes).
            3b. Rode `node scripts/estilo-ia.mjs recentes ${{ inputs.projeto }}` para ver o estilo dos vídeos anteriores
               e escolha o `estilo` deste vídeo: o que vier fixo em `pedido.estilo` é obrigatório; onde estiver "auto",
               escolha combinando com o tema SEM repetir a dinâmica, a legenda, a transição e o fundo do vídeo anterior.
               Adapte o roteiro (ritmo, tamanho das frases, quantidade de elementos) à dinâmica e ao formato.
            4. Escreva `projetos/${{ inputs.projeto }}/roteiro.json` e `projetos/${{ inputs.projeto }}/imagens.json`:
               gancho forte no início, cenas curtas com elementos animados e fontes na tela, e no final
               uma pergunta para o público (enquete) e um CTA (seguir). Respeite o tom e a duração pedidos.
            5. Rode `node scripts/validar-roteiro.mjs projetos/${{ inputs.projeto }}` e corrija até aparecer "✅ Roteiro válido"
               (trate também os avisos de duração e de fontes).

            Só termine depois de gravar os dois arquivos com a ferramenta Write; se algo do pedido parecer estranho ou repetido,
            escolha a interpretação mais provável e escreva mesmo assim (ninguém vai responder perguntas).
            Não altere nenhum outro arquivo e não faça commit.
          claude_args: |
            --model sonnet
            --max-turns 140
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(node scripts/validar-roteiro.mjs:*),Bash(node scripts/estilo-ia.mjs:*)"

      - name: Conferir roteiro
        run: node scripts/validar-roteiro.mjs "projetos/$ID"

      - name: Montar projeto
        run: node scripts/importar-roteiro.mjs "projetos/$ID" out/projeto.json

      - name: Narração (edge-tts)
        run: python3 scripts/voz.py out/projeto.json --midia "projetos/$ID"

      - name: Imagens — juntar candidatas (Wikimedia, Pixabay, Openverse, NASA)
        id: candidatas
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          node scripts/imagens.mjs out/projeto.json --midia "projetos/$ID" --candidatos out/candidatos || true
          echo "n=$(jq length out/candidatos/indice.json 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: Claude olha as candidatas e escolhe
        if: steps.candidatas.outputs.n != '0'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "*"
          prompt: |
            Você escolhe fotos REAIS para um vídeo documental. Leia `out/candidatos/indice.json`: para cada item há a `chave`,
            o que a foto precisa mostrar (`mostrar`), o trecho da narração em que ela aparece (`fala`) e a `folha`.
            Para cada item, abra a folha com Read (`out/candidatos/<folha>`): são fotos numeradas 1..N no canto.
            Escolha a foto que mostra EXATAMENTE o assunto da fala (o objeto, o lugar, a obra, a pessoa ou a época citados).
            Critérios, nesta ordem: 1) é o assunto certo (não um parecido, de outro lugar ou de outra época);
            2) nítida e bonita, boa para tela cheia; 3) sem texto grande, marca d'água, colagem ou mapa ilegível.
            Responda 0 quando nenhuma mostra o assunto: é melhor ficar sem foto do que mostrar algo que não tem a ver com a fala.
            Não escolha a mesma foto (igual) para chaves diferentes.
            Grave `out/candidatos/escolhas.json` no formato {"chave": número, ...} com todas as chaves do índice.
            Não altere nenhum outro arquivo e não faça commit.
          claude_args: |
            --model sonnet
            --max-turns 160
            --allowedTools "Read,Write,Glob"

      - name: Imagens — baixar as escolhidas (e buscar as que faltarem)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node scripts/imagens.mjs out/projeto.json --midia "projetos/$ID" --escolhas out/candidatos/escolhas.json

      - name: Enquadrar as fotos (rosto e assunto)
        run: python3 scripts/enquadrar.py out/projeto.json --midia "projetos/$ID"

      - name: Salvar projeto pronto
        run: |
          scripts/salvar_no_repo.sh "Roteiro, voz e imagens de $ID" python3 scripts/aplicar_resultado.py "projetos/$ID/projeto.json" \
            --resultado out/projeto.json --campos titulo,cenas,narracao,imagens,fontesPesquisa,voz,legenda,estiloIA,tema,efeitos,publicacao --limpar-midia

      - name: Próximo vídeo do canal (um de cada vez)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          canal=$(jq -r '.pedido.canal.id // empty' "projetos/$ID/projeto.json")
          [ -z "$canal" ] && exit 0
          scripts/salvar_no_repo.sh "Canal $canal: próximo da fila" node scripts/canal.mjs proximo "$canal"
          prox=$(grep '^projetos=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          for id in ${prox//,/ }; do gh workflow run gerar-ia.yml -f projeto="$id"; done

      - name: Marcar erro no projeto
        if: failure()
        run: |
          scripts/salvar_no_repo.sh "Erro ao gerar $ID" python3 scripts/aplicar_resultado.py "projetos/$ID/projeto.json" \
            --erro "Falhou ao gerar o vídeo. Veja o log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
